function isPast(d){var t=new Date();t.setHours(0,0,0,0);var x=new Date(d);x.setHours(0,0,0,0);return x<t;}
function isToday(d){return d.toDateString()===new Date().toDateString();}
function isTodayStr(iso){return new Date(iso).toDateString()===new Date().toDateString();}
function localISO(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function ck(d,t){return localISO(d)+'_'+t;}
function et(t){return (parseInt(t)+1)+':00';}
function fmt(d){return (d.getMonth()+1)+'/'+d.getDate();}
function wkDates(o){
  var n=new Date(),dy=n.getDay(),m=new Date(n);
  m.setDate(n.getDate()-(dy===0?6:dy-1)+o*7);
  var a=[];for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);a.push(d);}return a;
}
function clientWkDates(o){
  var n=new Date();n.setHours(0,0,0,0);
  var a=[];for(var i=0;i<7;i++){var d=new Date(n);d.setDate(n.getDate()+o*7+i);a.push(d);}return a;
}


async function doClientLogin(){
  var email=document.getElementById('cl-email-inp').value.trim();
  if(!email||email.indexOf('@')<0){document.getElementById('cl-email-err').textContent='正しいメールアドレスを入力してください';return;}
  L(true);
  var r=await sb.from('clients').select('id').eq('email',email).maybeSingle();
  L(false);
  if(r.error){document.getElementById('cl-email-err').textContent='通信エラーが発生しました。再度お試しください';return;}
  if(!r.data){document.getElementById('cl-email-err').textContent='登録されていないメールアドレスです';return;}
  localStorage.setItem('myEmail',email);
  localStorage.setItem('sessionMode','client');
  myEmail=email;
  document.getElementById('client-login-screen').style.display='none';
  mode='client';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('topbar-badge').textContent='お客様';
  document.getElementById('topbar-badge').className='tbadge tbadge-c';
  document.getElementById('client-screen').style.display='block';
  L(true);loadData().then(function(){renderC();L(false);});
}
function backToLogin(){
  document.getElementById('client-login-screen').style.display='flex';
  document.getElementById('topbar').style.display='none';
  document.getElementById('client-screen').style.display='none';
  document.getElementById('cl-email-inp').value='';
  document.getElementById('cl-email-err').textContent='';

async function loadData(){
  L(true);
  var dates=mode==='client'?clientWkDates(wkOff):wkDates(wkOff);
  var s=localISO(dates[0]),e=localISO(dates[6]);
  var r1=await sb.from('slots').select('*').gte('date_key',s).lte('date_key',e+'_z');
  slotSets={};offSlots={};
  (r1.data||[]).forEach(function(row){
    if(row.is_off){offSlots[row.date_key]=true;}
    else{if(!slotSets[row.date_key])slotSets[row.date_key]=new Set();slotSets[row.date_key].add(row.menu+'-'+row.loc);}
  });
  myEmail=localStorage.getItem('myEmail')||'';
  if(mode==='client'){
    var r2a=await sb.from('bookings').select('date_key,loc').eq('status','confirmed').gte('date_key',s).lte('date_key',e+'_z');
    bookings={};(r2a.data||[]).forEach(function(r){bookings[r.date_key]={date_key:r.date_key,loc:r.loc,_booked:true};});
    myBookings=new Set();
    if(myEmail){
      var r2b=await sb.from('bookings').select('*').eq('email',myEmail).eq('status','confirmed').gte('date_key',s).lte('date_key',e+'_z');
      (r2b.data||[]).forEach(function(r){bookings[r.date_key]=r;myBookings.add(r.date_key);});
    }
  } else {
    var r2=await sb.from('bookings').select('*').eq('status','confirmed').gte('date_key',s).lte('date_key',e+'_z');
    bookings={};(r2.data||[]).forEach(function(r){bookings[r.date_key]=r;});myBookings=new Set();
  }
  blockedSlots={};
  var _bAllLocs=['meguro','yokohama','ebisu'];
  Object.values(bookings).forEach(function(bk){if(!bk||!bk.loc)return;var _bp=bk.date_key.split('_');if(_bp.length<2)return;var _biso=_bp[0],_bhi=parseInt(_bp[1]);if(isNaN(_bhi))return;var _boL=_bAllLocs.filter(function(l){return l!==bk.loc;});[-1,1].forEach(function(d){var _bh=_bhi+d;if(_bh<10||_bh>21)return;var _bk=_biso+'_'+_bh+':00';if(!blockedSlots[_bk])blockedSlots[_bk]=new Set();_boL.forEach(function(l){blockedSlots[_bk].add(l);});});});
  var r3=await sb.from('day_offs').select('*').gte('date_iso',s).lte('date_iso',e);
  dayOffs={};(r3.data||[]).forEach(function(r){dayOffs[r.date_iso]=true;});
  L(false);
}

async function saveSlot(k,menu,loc){await sb.from('slots').insert({date_key:k,menu:menu,loc:loc,is_off:false});}
async function saveOffSlot(k){await sb.from('slots').delete().eq('date_key',k);await sb.from('slots').insert({date_key:k,menu:null,loc:null,is_off:true});}
async function deleteSlot(k,m,l){await sb.from('slots').delete().match({date_key:k,menu:m,loc:l});}
async function deleteAllSlots(k){await sb.from('slots').delete().eq('date_key',k);}
async function saveDayOff(iso){await sb.from('day_offs').upsert({date_iso:iso},{onConflict:'date_iso'});await sb.from('slots').delete().like('date_key',iso+'%');}
async function deleteDayOff(iso){await sb.from('day_offs').delete().eq('date_iso',iso);}
async function saveBooking(k,menu,loc,name,email,phone,msg){var r=await sb.from('bookings').insert({date_key:k,menu:menu,loc:loc,name:name,email:email,phone:phone,message:msg});return !r.error;}
async function deleteBooking(k){await sb.from('bookings').update({status:'cancelled'}).eq('date_key',k);}

function deepCopySlotSets(s){var c={};for(var k in s){c[k]=new Set(s[k]);}return c;}function clearSelState(){selMode=false;selCells=new Set();preSelSlotSets=null;document.getElementById('msel-add').classList.remove('active');document.getElementById('at-add').classList.remove('active');}function toggleSelMode(){if(offMode)cancelOffMode();if(selMode){cancelSel();return;}selMode=true;preSelSlotSets=deepCopySlotSets(slotSets);document.getElementById('msel-add').classList.add('active');document.getElementById('at-add').classList.add('active');renderT();}
function cancelSel(){if(preSelSlotSets!==null){slotSets=preSelSlotSets;}clearSelState();renderT();}
function cancelOffMode(){offMode=false;offCells=new Set();}
function updSC(){document.getElementById('sel-count').textContent=selCells.size+'枠選択中';}

function assignSel(menu,loc){
  if(!selCells.size){showToast('⚠ 枠を選んでください');return;}
  var ml=menu+'-'+loc;
  var allHave=[...selCells].every(function(k){return slotSets[k]&&slotSets[k].has(ml);});
  if(allHave){
    for(var k of selCells){if(slotSets[k]){slotSets[k].delete(ml);if(!slotSets[k].size)delete slotSets[k];}}
    renderT();showToast('取り消し（完了で確定）');
  } else {
    for(var k of selCells){if(!slotSets[k])slotSets[k]=new Set();slotSets[k].add(ml);delete offSlots[k];}
    renderT();showToast('✓ '+selCells.size+'枠に追加（完了で確定）');
  }
}
function removeSel(){for(var k of selCells){delete slotSets[k];}renderT();showToast('削除（完了で確定）');}async function confirmSel(){L(true);var pre=preSelSlotSets||{};var allKeys=new Set([...Object.keys(slotSets),...Object.keys(pre)]);for(var k of allKeys){var newSet=slotSets[k]||new Set();var oldSet=pre[k]||new Set();if(newSet.size===0&&oldSet.size>0){await deleteAllSlots(k);}else{for(var ml of newSet){if(!oldSet.has(ml)){var pts=ml.split('-');await saveSlot(k,pts[0],pts[1]);}}for(var ml of oldSet){if(!newSet.has(ml)){var pts=ml.split('-');await deleteSlot(k,pts[0],pts[1]);}}}}clearSelState();L(false);renderT();showToast('✓ 空き枠を保存しました');}

function mkTags(sets){
  var w=document.createElement('div');w.className='slot-tags';
  [...sets].slice(0,3).forEach(function(ml){var s=document.createElement('span');s.className='stag '+(TC[ml]||'');s.textContent=TL[ml]||ml;w.appendChild(s);});
  if(sets.size>3){var m=document.createElement('span');m.className='stag';m.style.cssText='background:#f5f5f5;color:#666';m.textContent='+'+(sets.size-3);w.appendChild(m);}
  return w;
}

function renderT(){
  var dates=wkDates(wkOff);
  document.getElementById('wlbl-t').textContent=fmt(dates[0])+' – '+fmt(dates[6]);
  var COL='36px repeat(7,1fr)';
  var head=document.getElementById('cal-head-t');
  head.style.gridTemplateColumns=COL;
  head.innerHTML='<div></div>'+dates.map(function(d){
    var iso=localISO(d),doff=!!dayOffs[iso],past=isPast(d);
    var dy=d.getDay();
    var dcls=(dy===6?' sat':dy===0?' sun':'');
    return '<div class="cdh'+(doff?' day-off':'')+'" id="hdr-'+iso+'" style="'+(past?'opacity:.35':'')+'">'
      +'<div class="cdn'+dcls+'">'+DJ[d.getDay()]+'</div><div class="cdd'+(isToday(d)?' today':'')+dcls+'">'+d.getDate()+(doff?'✕':'')+'</div><div class="dob"></div></div>';
  }).join('');
  var body=document.getElementById('cal-body-t');
  body.style.gridTemplateColumns=COL;body.innerHTML='';
  TIMES.forEach(function(t){
    var tl=document.createElement('div');tl.className='tlbl';tl.textContent=t;body.appendChild(tl);
    dates.forEach(function(date){
      var k=ck(date,t),iso=localISO(date);
      var sets=slotSets[k],hasSets=sets&&sets.size>0;
      var isOff=!!offSlots[k],doff=!!dayOffs[iso],past=isPast(date);
      var isSel=selCells.has(k),bk=bookings[k];
      var sc=document.createElement('div');sc.className='slot-cell';
      var sl=document.createElement('div');sl.className='slot';
      if(bk&&past){
        sl.className='slot '+(BKC[bk.loc]||'t-bk-m');sl.style.opacity='.45';sl.style.pointerEvents='none';
        var last=bk.name?(bk.name.split(/[\s\u3000]/)[0]):'';
        sl.innerHTML='<span style="font-size:7px;font-weight:700;overflow:hidden;max-width:100%;text-overflow:ellipsis" class="'+(BLC[bk.loc]||'')+'">'+LOCS[bk.loc]+'：'+last+'様</span>';
      } else if(past){sl.className='slot t-idle';sl.style.opacity='.2';sl.style.pointerEvents='none';}
      else if(doff){sl.className='slot t-dayoff';sl.innerHTML='<span class="x-off">✕</span>';}
      else if(bk){
        sl.className='slot '+(BKC[bk.loc]||'t-bk-m');
        var last=bk.name?(bk.name.split(/[\s\u3000]/)[0]):'';
        sl.innerHTML='<span style="font-size:7px;font-weight:700;overflow:hidden;max-width:100%;text-overflow:ellipsis" class="'+(BLC[bk.loc]||'')+'">'+LOCS[bk.loc]+'：'+last+'様</span>';
        if(!selMode){(function(dd,tt,kk){sl.onclick=function(){openBkDetail(dd,tt,kk);};})(date,t,k);}
      } else if(selMode&&isSel){sl.className='slot t-sel-add';if(hasSets)sl.appendChild(mkTags(sets));else sl.innerHTML='<span style="font-size:9px;color:#fff">✓</span>';}
      else if(isOff){sl.className='slot '+(selMode?'t-idle-add':'t-idle');if(selMode)sl.innerHTML='<span style="font-size:9px;color:#ca8a04">＋</span>';}
      else if(hasSets){sl.className='slot '+(selMode?'t-avail-add':'t-avail');sl.appendChild(mkTags(sets));if(!selMode){(function(dd,tt,kk){sl.onclick=function(){openSlotDetail(dd,tt,kk);};})(date,t,k);}}
      else{sl.className='slot '+(selMode?'t-idle-add':'t-idle');if(selMode)sl.innerHTML='<span style="font-size:9px;color:#ca8a04">＋</span>';}
      if(!past&&selMode&&!doff&&!bk){
        (function(kk,s){
          var justAdded=false;
          s.setAttribute('data-ck',kk);
          s.onmousedown=function(e){e.preventDefault();drag=true;if(!selCells.has(kk)){selCells.add(kk);s.className='slot t-sel-add';updSC();justAdded=true;}else{justAdded=false;}};
          s.ontouchstart=function(e){e.stopPropagation();drag=true;};
          s.onmouseenter=function(){if(drag&&!selCells.has(kk)){selCells.add(kk);updSC();s.className='slot t-sel-add';}};
          s.onclick=function(e){e.stopPropagation();if(justAdded){justAdded=false;return;}if(selCells.has(kk)){selCells.delete(kk);s.className='slot t-idle-add';}else{selCells.add(kk);s.className='slot t-sel-add';}updSC();};
        })(k,sl);
      }
      sc.appendChild(sl);body.appendChild(sc);
    });
  });
  updStats();
}
document.addEventListener('mouseup',function(){drag=false;});
document.addEventListener('touchend',function(){drag=false;});
document.addEventListener('touchmove',function(e){
  if(!drag)return;
  var touch=e.touches[0];
  var el=document.elementFromPoint(touch.clientX,touch.clientY);
  while(el&&!el.getAttribute('data-ck')){el=el.parentElement;}
  if(!el)return;
  var kk=el.getAttribute('data-ck');
  e.preventDefault();
  if(selMode&&!selCells.has(kk)){selCells.add(kk);updSC();el.className='slot t-sel-add';}
},{passive:false});

  var s=y+'-'+String(m+1).padStart(2,'0')+'-01';
  var e=y+'-'+String(m+1).padStart(2,'0')+'-'+String(new Date(y,m+1,0).getDate()).padStart(2,'0');

    +'<div style="font-size:12px;font-weight:500;color:#666;margin-bottom:8px">回数券を追加</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:10px">'
      +'<button onclick="addTix(\''+email+'\',1,\'単発\')" style="flex:1;padding:9px;border-radius:8px;border:1.5px solid #c2410c;background:#fff1f2;color:#c2410c;font-size:12px;cursor:pointer">＋単発</button>'
      +'<button onclick="addTix(\''+email+'\',8,\'8回券\',true)" style="'+tixSt+'">＋8回</button>'
      +'<button onclick="addTix(\''+email+'\',16,\'16回券\',true)" style="'+tixSt+'">＋16回</button>'
    +'</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:10px"><input type="number" id="custom-tix" min="1" max="99" placeholder="任意の回数" class="finp" style="flex:1"><button onclick="addCustomTix(\''+email+'\')" style="'+custSt+'">追加</button></div>'
    +'<button onclick="consumeTix(\''+email+'\')" style="width:100%;padding:10px;border-radius:8px;border:1.5px solid #f43f5e;background:#fff1f2;color:#be123c;font-size:13px;cursor:pointer;margin-bottom:12px">1回消化する（当日キャンセル等）</button>'
    +'<div style="font-size:12px;font-weight:500;color:#666;margin-bottom:6px">メモ</div>'
    +'<textarea id="client-note" class="finp" rows="2" style="margin-bottom:4px" placeholder="メモを入力" onblur="saveClientNoteAuto(\''+email+'\')">'+escHtml(c.notes||'')+'</textarea>'
    +'<div style="font-size:10px;color:#aaa;margin-bottom:6px">フォーカスを外すと自動保存</div>'
    +'<button onclick="saveClientNote(\''+email+'\')" style="width:100%;padding:8px;border-radius:8px;border:1.5px solid #16a34a;background:#f0fdf4;color:#15803d;font-size:12px;cursor:pointer;margin-bottom:12px">メモを保存</button>'
    +'<div style="font-size:12px;font-weight:500;color:#666;margin-bottom:6px">予約履歴（直近20件）</div>'
    +'<div>'+bkHtml+'</div>'
    +'<div style="margin-top:20px;padding-top:16px;border-top:1px solid #f0f0f0;text-align:center"><button data-email="'+escHtml(email)+'" data-name="'+escHtml(c.name)+'" onclick="confirmDeleteClient(this.dataset.email,this.dataset.name)" style="font-size:11px;padding:6px 16px;border-radius:6px;border:1px solid #fca5a5;background:transparent;color:#dc2626;cursor:pointer">このお客様を削除する</button></div>';
  openPanel();
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function saveClientNoteAuto(email){
  var el=document.getElementById('client-note');if(!el)return;
  var note=el.value;
  var c=clients.find(function(x){return x.email===email;});
  if(c&&c.notes===note)return;
  await sb.from('clients').update({notes:note}).eq('email',email);
  if(c)c.notes=note;
  showToast('✅ メモを自動保存しました');
}
async function saveClientNote(email){
  var note=document.getElementById('client-note').value;
  L(true);await sb.from('clients').update({notes:note}).eq('email',email);L(false);
  var c=clients.find(function(x){return x.email===email;});if(c)c.notes=note;
  showToast('✅ メモを保存しました');
}
async function addTix(email,amount,label,reset){
  L(true);
  var newTotal,newUsed;
  if(reset){newTotal=amount;newUsed=0;}
  else{
    var cr=await sb.from('clients').select('total_tickets,used_tickets').eq('email',email).maybeSingle();
    var c=cr.data||{};
    newTotal=(c.total_tickets||0)+amount;newUsed=c.used_tickets||0;
  }
  await sb.from('clients').update({total_tickets:newTotal,used_tickets:newUsed}).eq('email',email);
  await sb.from('ticket_logs').insert({client_email:email,type:'purchase',amount:amount,note:label+'追加'});
  L(false);closePanel();await loadClients();showToast('✅ '+label+'を追加しました');
}
async function addCustomTix(email){var n=parseInt(document.getElementById('custom-tix').value);if(!n||n<1){showToast('⚠ 回数を入力してください');return;}await addTix(email,n,n+'回');}
async function consumeTix(email){
  var c=clients.find(function(x){return x.email===email;});
  if(!c||(c.used_tickets||0)>=(c.total_tickets||0)){showToast('⚠ 残り回数がありません');return;}
  L(true);await sb.from('clients').update({used_tickets:(c.used_tickets||0)+1}).eq('email',email);await sb.from('ticket_logs').insert({client_email:email,type:'consume',amount:1,note:'手動消化'});L(false);
  closePanel();await loadClients();showToast('1回消化しました');
}

function updStats(){
  var ds=wkDates(wkOff).map(function(d){return localISO(d);});
  var a=0,b=0;
  Object.keys(slotSets).forEach(function(k){if(ds.some(function(d){return k.startsWith(d);})&&!bookings[k])a+=slotSets[k].size;});
  Object.keys(bookings).forEach(function(k){if(ds.some(function(d){return k.startsWith(d);}))b++;});
  document.getElementById('sta').textContent=a;document.getElementById('stb').textContent=b;
}
async function changeWeek(d){if(d<0&&mode==='client'&&wkOff<=0)return;wkOff+=d;await loadData();if(mode==='trainer')renderT();else renderC();}
function openPanel(){document.getElementById('panel').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closePanel(){document.getElementById('panel').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}

window.onload=async function(){
  loadHolidays();
  var clInp=document.getElementById('cl-email-inp');
  if(clInp){
    clInp.onkeydown=function(e){if(e.key==='Enter')doClientLogin();};
    var saved=localStorage.getItem('myEmail');
    if(saved)clInp.value=saved;
  }
  // セッション復元
  var savedMode=localStorage.getItem('sessionMode');
  if(savedMode==='client'){
    var savedEmail=localStorage.getItem('myEmail');
    if(savedEmail){
      L(true);
      try{
        var rv=await sb.from('clients').select('id').eq('email',savedEmail).maybeSingle();
        if(rv.data){
          myEmail=savedEmail;mode='client';
          document.getElementById('client-login-screen').style.display='none';
          document.getElementById('topbar').style.display='flex';
          document.getElementById('topbar-badge').textContent='お客様';
          document.getElementById('topbar-badge').className='tbadge tbadge-c';
          document.getElementById('client-screen').style.display='block';
          await loadData();renderC();
          var savedCTab=localStorage.getItem('clientTab');
          if(savedCTab&&savedCTab!=='cal')switchCTab(savedCTab);
        } else {
          localStorage.removeItem('sessionMode');
        }
      }finally{L(false);}
    } else {
      localStorage.removeItem('sessionMode');
    }
  }
};
</script>
