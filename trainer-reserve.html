<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Reserve</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;background:#fff;color:#1a1a1a;}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid #e5e5e5;position:sticky;top:0;background:#fff;z-index:50;}
.logo{font-size:15px;font-weight:700;color:#1a1a1a;letter-spacing:-.3px;}
.logo .reserve{color:#c2410c;}
.mode-toggle{display:flex;gap:3px;background:#f5f5f5;padding:3px;border-radius:8px;}
.mode-btn{padding:4px 11px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:#666;transition:all .15s;}
.mode-btn.active{background:#fff;color:#1a1a1a;box-shadow:0 1px 3px rgba(0,0,0,.1);}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;z-index:997;font-size:14px;color:#666;}

/* PASSWORD SCREEN */
.pw-screen{position:fixed;inset:0;background:#fff;z-index:998;display:flex;align-items:center;justify-content:center;}
.pw-box{background:#fff;border:0.5px solid #e5e5e5;border-radius:16px;padding:32px 28px;width:min(340px,90vw);box-shadow:0 4px 24px rgba(0,0,0,.08);}
.pw-logo{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:4px;}
.pw-logo span{color:#c2410c;}
.pw-sub{font-size:12px;color:#666;margin-bottom:24px;}
.pw-label{font-size:11px;font-weight:600;color:#666;margin-bottom:5px;display:block;}
.pw-input{width:100%;padding:10px 12px;border:0.5px solid #e5e5e5;border-radius:8px;font-size:14px;margin-bottom:6px;background:#fff;color:#1a1a1a;}
.pw-input:focus{outline:none;border-color:#c2410c;box-shadow:0 0 0 2px rgba(194,65,12,.1);}
.pw-err{font-size:11px;color:#e94560;margin-bottom:12px;min-height:16px;}
.pw-btn{width:100%;padding:11px;background:#c2410c;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.pw-btn:hover{opacity:.88;}
.pw-bypass{text-align:center;margin-top:14px;font-size:11px;color:#999;}
.pw-bypass a{color:#666;cursor:pointer;text-decoration:underline;}

/* WEEK BAR */
.week-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:0.5px solid #e5e5e5;}
.wbtn{background:#f5f5f5;border:.5px solid #e5e5e5;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px;color:#666;display:flex;align-items:center;justify-content:center;}
.wbtn:hover{color:#1a1a1a;}
.wlbl{font-size:12px;font-weight:600;color:#1a1a1a;}

/* MODE SELECTOR */
.mode-selector{display:flex;gap:8px;padding:10px 14px;border-bottom:0.5px solid #e5e5e5;background:#f5f5f5;}
.msel-btn{flex:1;padding:10px 8px;border-radius:9px;border:2px solid #e5e5e5;cursor:pointer;font-size:12px;font-weight:700;text-align:center;transition:all .15s;background:#fff;color:#666;}
.msel-btn .msel-icon{font-size:16px;display:block;margin-bottom:3px;}
.msel-btn.mode-add{border-color:#f59e0b;color:#92400e;background:#fffbeb;}
.msel-btn.mode-add.active{background:#f59e0b;color:#fff;border-color:#f59e0b;box-shadow:0 2px 8px rgba(245,158,11,.3);}
.msel-btn.mode-off{border-color:#f43f5e;color:#9f1239;background:#fff1f2;}
.msel-btn.mode-off.active{background:#f43f5e;color:#fff;border-color:#f43f5e;box-shadow:0 2px 8px rgba(244,63,94,.3);}
.msel-hint{font-size:10px;display:block;margin-top:1px;opacity:.8;}

/* ACTION TOOLBAR */
.action-toolbar{display:none;padding:8px 14px;border-bottom:1px solid;flex-wrap:wrap;gap:6px;align-items:center;}
.action-toolbar.active{display:flex;}
.at-add{background:#fffbeb;border-color:#fde68a;}
.at-off{background:#fff1f2;border-color:#fecdd3;}
.at-count{font-size:12px;font-weight:700;white-space:nowrap;}
.at-add .at-count{color:#92400e;}.at-off .at-count{color:#9f1239;}
.at-chips{display:flex;gap:4px;flex-wrap:wrap;}
.atc{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .12s;white-space:nowrap;}
.atc-pm{background:#dbeafe;border-color:#93c5fd;color:#1e40af;}
.atc-py{background:#fef9c3;border-color:#fde047;color:#854d0e;}
.atc-te{background:#fce7f3;border-color:#f9a8d4;color:#9d174d;}
.atc-ty{background:#d1fae5;border-color:#6ee7b7;color:#065f46;}
.atc-rm{background:#fee2e2;border-color:#fca5a5;color:#991b1b;}
.atc-off{background:#ffe4e6;border-color:#fda4af;color:#9f1239;}
.at-done{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;border:1px solid #e5e5e5;color:#666;white-space:nowrap;}

/* STATS */
.stats-bar{display:flex;gap:8px;padding:8px 14px;border-bottom:0.5px solid #e5e5e5;}
.stat-pill{flex:1;background:#f5f5f5;border-radius:8px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;}
.stat-num{font-size:18px;font-weight:700;line-height:1;}
.stat-lbl{font-size:10px;color:#666;}
.sp-avail .stat-num{color:#16a34a;}.sp-booked .stat-num{color:#e94560;}

/* LEGEND */
.legend-bar{display:flex;gap:8px;padding:6px 14px;border-bottom:0.5px solid #e5e5e5;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:#666;}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* CALENDAR */
.cal-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cal-inner{padding:8px 10px;min-width:320px;}
.cal-head{display:grid;gap:1px;margin-bottom:2px;}
.cdh{text-align:center;padding:3px 1px;position:relative;border-radius:4px;transition:background .12s;}
.cdn{font-size:9px;color:#999;font-weight:500;letter-spacing:.3px;}
.cdd{font-size:13px;font-weight:600;color:#1a1a1a;}
.cdd.today{color:#e94560;}
.cdh.off-mode-hover:hover{background:#fff1f2;cursor:pointer;}
.cdh.day-off .cdd{color:#f43f5e;}
.cdh.day-off .cdn{opacity:.6;color:#f43f5e;}
.dob{display:none;position:absolute;bottom:1px;left:3px;right:3px;height:2px;background:#f43f5e;border-radius:1px;}
.cdh.day-off .dob{display:block;}
.cal-body{display:grid;gap:1px;}
.tlbl{font-size:8px;color:#999;text-align:right;padding-right:3px;padding-top:3px;line-height:1.2;}
.cell{display:flex;flex-direction:column;gap:1px;}

/* SLOTS */
.slot{border-radius:3px;height:24px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:600;transition:background .08s,border .08s;border:1px solid transparent;overflow:hidden;padding:0 2px;white-space:nowrap;}
.slot.t-empty{background:#f5f5f5;opacity:.15;cursor:default;}
.slot.t-idle{background:#f5f5f5;border:.5px solid #e5e5e5;opacity:.4;cursor:default;}
.slot.t-idle-add{background:#fef9c3;border:.5px dashed #fbbf24;opacity:.7;cursor:pointer;}
.slot.t-idle-add:hover{opacity:1;}
.slot.t-idle-off{background:#fff1f2;border:.5px dashed #fda4af;opacity:.7;cursor:pointer;}
.slot.t-idle-off:hover{opacity:1;}
.slot.t-sel-add{background:#f59e0b !important;border:2px solid #d97706 !important;opacity:1 !important;}
.slot.t-sel-off{background:#f43f5e !important;border:2px solid #be123c !important;opacity:1 !important;}
.slot.t-avail{background:#dcfce7;border-color:#86efac;cursor:pointer;}
.slot.t-avail-add{background:#dcfce7;border:2px dashed #fbbf24;cursor:pointer;}
.slot.t-avail-off{background:#dcfce7;border:2px dashed #fda4af;cursor:pointer;}
.slot.t-avail:hover,.slot.t-avail-add:hover,.slot.t-avail-off:hover{filter:brightness(.93);}
.slot.t-off{background:#ffe4e6;border:.5px solid #fda4af;cursor:pointer;}
.slot.t-dayoff{background:#ffe4e6;border:.5px solid #fda4af;cursor:default;opacity:.6;}
.slot.t-bk-m{background:#dbeafe;border-color:#93c5fd;cursor:pointer;}
.slot.t-bk-y{background:#fef9c3;border-color:#fde047;cursor:pointer;}
.slot.t-bk-e{background:#fce7f3;border-color:#f9a8d4;cursor:pointer;}
.slot.t-bk-m:hover,.slot.t-bk-y:hover,.slot.t-bk-e:hover{filter:brightness(.96);}
.bl-m{color:#1e40af;}.bl-y{color:#854d0e;}.bl-e{color:#9d174d;}
.x-off{font-size:9px;color:#f43f5e;font-weight:700;}
.slot.c-avail{background:#dcfce7;border-color:#86efac;color:#166534;cursor:pointer;}
.slot.c-avail:hover{filter:brightness(.93);}
.slot.c-mine{background:#16a34a;border-color:#15803d;cursor:pointer;}
.slot.c-booked{background:#f5f5f5;border:.5px solid #e5e5e5;opacity:.4;cursor:default;}
.slot.c-off{background:#ffe4e6;border:.5px solid #fda4af;cursor:default;}
.slot.c-empty{background:#f5f5f5;opacity:.12;cursor:default;}
.slot-tags{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-items:center;}
.stag{font-size:7px;font-weight:700;padding:0 2px;border-radius:2px;line-height:1.5;white-space:nowrap;}
.stag-pm{background:#dbeafe;color:#1e40af;}
.stag-py{background:#fef9c3;color:#854d0e;}
.stag-te{background:#fce7f3;color:#9d174d;}
.stag-ty{background:#d1fae5;color:#065f46;}

/* CLIENT SELECT */
#client-screen{display:none;}
.cs-wrap{padding:20px 16px;}
.cs-step{font-size:10px;font-weight:600;color:#666;letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px;}
.cs-title{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:16px;}
.cs-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.cs-card{border:2px solid #e5e5e5;border-radius:12px;padding:14px 12px;cursor:pointer;transition:all .15s;background:#fff;}
.cs-card:hover,.cs-card:active{border-color:#e94560;transform:translateY(-1px);}
.cs-card.selected{border-color:#e94560;background:#fff1f2;}
.cs-card-icon{font-size:20px;margin-bottom:6px;}
.cs-card-name{font-size:13px;font-weight:700;color:#1a1a1a;margin-bottom:2px;}
.cs-card-sub{font-size:10px;color:#666;}
.cs-card.selected .cs-card-name{color:#e94560;}
.cs-locs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.cs-loc{padding:8px 16px;border-radius:99px;border:2px solid #e5e5e5;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#666;transition:all .15s;}
.cs-loc.selected{background:#e94560;border-color:#e94560;color:#fff;}
.cs-loc.unavail{opacity:.3;pointer-events:none;}
.cs-bar{background:#f5f5f5;border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cs-bar-info{font-size:11px;color:#666;}
.cs-bar-info b{color:#1a1a1a;font-size:12px;}
.go-btn{padding:10px 18px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.go-btn:disabled{opacity:.3;cursor:default;}
#client-cal{display:none;}
.ccal-header{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:0.5px solid #e5e5e5;background:#f5f5f5;}
.back-btn{background:#fff;border:.5px solid #e5e5e5;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;color:#666;white-space:nowrap;}
.ctag{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.tag-pilates{background:#dbeafe;color:#1e40af;}
.tag-training{background:#fce7f3;color:#9d174d;}
.tag-meguro{background:#dbeafe;color:#1e40af;}
.tag-yokohama{background:#fef9c3;color:#854d0e;}
.tag-ebisu{background:#fce7f3;color:#9d174d;}

/* PANEL */
.panel{position:fixed;right:0;top:0;bottom:0;width:min(300px,100vw);background:#fff;border-left:.5px solid #e5e5e5;padding:18px 16px;transform:translateX(110%);transition:transform .25s ease;z-index:200;overflow-y:auto;}
.panel.open{transform:translateX(0);}
.pcl{position:absolute;top:12px;right:12px;background:#f5f5f5;border:.5px solid #e5e5e5;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;color:#666;display:flex;align-items:center;justify-content:center;}
.ptitle{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:2px;padding-right:28px;}
.psub{font-size:11px;color:#666;margin-bottom:14px;}
.fgrp{margin-bottom:12px;}
.flbl{font-size:11px;font-weight:600;color:#666;margin-bottom:4px;display:block;}
.finp{width:100%;padding:8px 10px;border:.5px solid #e5e5e5;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;}
.finp:focus{outline:none;border-color:#e94560;box-shadow:0 0 0 2px rgba(233,69,96,.1);}
.bp{width:100%;padding:10px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:4px;}
.bp:hover{opacity:.88;}
.bd{width:100%;padding:9px;background:transparent;color:#e94560;border:1.5px solid #e94560;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;}
.bd:hover{background:#fee2e2;}
.infor{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:.5px solid #e5e5e5;font-size:12px;gap:8px;}
.infor:last-child{border-bottom:none;}
.ik{color:#666;white-space:nowrap;flex-shrink:0;}
.iv{color:#1a1a1a;font-weight:500;text-align:right;}
.mail-preview{background:#f5f5f5;border-radius:9px;padding:12px 14px;margin:10px 0;font-size:11px;color:#666;line-height:1.7;}
.mail-preview h4{font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:6px;}
.mail-to{font-size:10px;background:#fff;border-radius:5px;padding:3px 8px;margin-bottom:8px;color:#666;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:199;display:none;}
.overlay.show{display:block;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a1a2e;color:#fff;padding:9px 16px;border-radius:10px;font-size:12px;font-weight:500;transition:transform .25s;z-index:300;text-align:center;max-width:90vw;}
.toast.show{transform:translateX(-50%) translateY(0);}

#trainer-screen{display:none;}
</style>
</head>
<body>

<div id="loading" class="loading-overlay">読み込み中...</div>

<!-- PASSWORD SCREEN -->
<div class="pw-screen" id="pw-screen">
  <div class="pw-box">
    <div class="pw-logo">Trainer <span>Reserve</span></div>
    <div class="pw-sub">トレーナー専用ログイン</div>
    <label class="pw-label">パスワード</label>
    <input class="pw-input" id="pw-input" type="password" placeholder="パスワードを入力">
    <div class="pw-err" id="pw-err"></div>
    <button class="pw-btn" id="pw-btn">ログイン</button>
    <div class="pw-bypass"><a id="client-link" style="cursor:pointer">お客様はこちら →</a></div>
  </div>
</div>

<div class="topbar" id="topbar" style="display:none">
  <div class="logo">Trainer <span class="reserve">Reserve</span></div>
  <div class="mode-toggle" id="mode-toggle-btns">
    <button class="mode-btn active" id="btn-trainer" onclick="setMode('trainer')">トレーナー</button>
    <button class="mode-btn" id="btn-client" onclick="setMode('client')">お客様</button>
  </div>
</div>

<!-- TRAINER -->
<div id="trainer-screen">
  <div class="mode-selector">
    <button class="msel-btn mode-add" id="msel-add" onclick="toggleSelMode()">
      <span class="msel-icon">＋</span>空き枠を追加
      <span class="msel-hint">タップして選択モードへ</span>
    </button>
    <button class="msel-btn mode-off" id="msel-off" onclick="toggleOffMode()">
      <span class="msel-icon">✕</span>対応不可を設定
      <span class="msel-hint">タップして選択モードへ</span>
    </button>
  </div>
  <div class="action-toolbar at-add" id="at-add">
    <span class="at-count" id="sel-count">0枠選択中</span>
    <div class="at-chips">
      <span style="font-size:10px;color:#92400e;font-weight:600">追加→</span>
      <button class="atc atc-pm" onclick="assignSel('pilates','meguro')">P・目黒</button>
      <button class="atc atc-py" onclick="assignSel('pilates','yokohama')">P・横浜</button>
      <button class="atc atc-te" onclick="assignSel('training','ebisu')">T・恵比寿</button>
      <button class="atc atc-ty" onclick="assignSel('training','yokohama')">T・横浜</button>
      <button class="atc atc-rm" onclick="removeSel()">削除</button>
    </div>
    <button class="at-done" onclick="cancelSel()">完了</button>
  </div>
  <div class="action-toolbar at-off" id="at-off">
    <span class="at-count" id="off-count">0枠選択中</span>
    <div class="at-chips">
      <button class="atc atc-off" onclick="applyOff()">OFFにする</button>
      <button class="atc atc-rm" onclick="cancelOff()">OFF解除</button>
    </div>
    <button class="at-done" onclick="cancelOffMode()">完了</button>
  </div>
  <div class="stats-bar">
    <div class="stat-pill sp-avail"><div><div class="stat-num" id="sta">0</div><div class="stat-lbl">空き枠</div></div></div>
    <div class="stat-pill sp-booked"><div><div class="stat-num" id="stb">0</div><div class="stat-lbl">予約済み</div></div></div>
  </div>
  <div class="legend-bar">
    <div class="li"><div class="ld" style="background:#dcfce7;border:1px solid #86efac"></div>空き</div>
    <div class="li"><div class="ld" style="background:#dbeafe;border:1px solid #93c5fd"></div>予約(目黒)</div>
    <div class="li"><div class="ld" style="background:#fef9c3;border:1px solid #fde047"></div>予約(横浜)</div>
    <div class="li"><div class="ld" style="background:#fce7f3;border:1px solid #f9a8d4"></div>予約(恵比寿)</div>
    <div class="li"><div class="ld" style="background:#ffe4e6;border:1px solid #fda4af"></div>対応不可</div>
  </div>
  <div class="week-bar">
    <button class="wbtn" onclick="changeWeek(-1)">‹</button>
    <span class="wlbl" id="wlbl-t"></span>
    <button class="wbtn" onclick="changeWeek(1)">›</button>
  </div>
  <div class="cal-outer"><div class="cal-inner">
    <div class="cal-head" id="cal-head-t"></div>
    <div class="cal-body" id="cal-body-t"></div>
  </div></div>
</div>

<!-- CLIENT SELECT -->
<div id="client-screen">
  <div class="cs-wrap">
    <div class="cs-step">Step 1</div>
    <div class="cs-title">メニューを選んでください</div>
    <div class="cs-cards">
      <div class="cs-card" id="card-pilates" onclick="selMenu('pilates')">
        <div class="cs-card-icon">🧘</div>
        <div class="cs-card-name">ピラティス</div>
        <div class="cs-card-sub">目黒 / 横浜</div>
      </div>
      <div class="cs-card" id="card-training" onclick="selMenu('training')">
        <div class="cs-card-icon">💪</div>
        <div class="cs-card-name">パーソナルトレーニング</div>
        <div class="cs-card-sub">恵比寿 / 横浜</div>
      </div>
    </div>
    <div id="loc-step" style="display:none">
      <div class="cs-step">Step 2</div>
      <div class="cs-title">場所を選んでください</div>
      <div class="cs-locs" id="loc-chips"></div>
    </div>
    <div class="cs-bar">
      <div class="cs-bar-info" id="cs-info">メニューと場所を選んでください</div>
      <button class="go-btn" id="go-btn" onclick="goToCal()" disabled>空きを見る →</button>
    </div>
  </div>
</div>

<!-- CLIENT CAL -->
<div id="client-cal">
  <div class="ccal-header">
    <button class="back-btn" onclick="backToSel()">← 選び直す</button>
    <span class="ctag" id="cch-m"></span>
    <span class="ctag" id="cch-l"></span>
  </div>
  <div class="week-bar">
    <button class="wbtn" onclick="changeWeek(-1)">‹</button>
    <span class="wlbl" id="wlbl-c"></span>
    <button class="wbtn" onclick="changeWeek(1)">›</button>
  </div>
  <div class="cal-outer"><div class="cal-inner">
    <div class="cal-head" id="cal-head-c"></div>
    <div class="cal-body" id="cal-body-c"></div>
  </div></div>
</div>

function isPastDate(date){
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(date); d.setHours(0,0,0,0);
  return d < today;
}
function ck(d,t){ return d.toISOString().slice(0,10)+'_'+t; }
function et(t){
  var parts = t.split(':');
  var h = parseInt(parts[0]), m = parseInt(parts[1]);
  var e = h*60+m+60;
  return Math.floor(e/60)+':'+(e%60===0?'00':'30');
}
function isToday(d){ return d.toDateString()===new Date().toDateString(); }
function fmt(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function wkDates(off){
  var n=new Date(),dy=n.getDay(),mon=new Date(n);
  mon.setDate(n.getDate()-(dy===0?6:dy-1)+off*7);
  var arr=[];
  for(var i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); arr.push(d); }
  return arr;
}

}

async function tCancelBk(k){ loading(true); await deleteBooking(k); delete bookings[k]; myBookings.delete(k); await loadData(); loading(false); closePanel(); renderT(); showToast('予約をキャンセルしました'); }

function openOffDetail(date,t,k){
  var ds=(date.getMonth()+1)+'月'+date.getDate()+'日（'+DJ[date.getDay()]+'）';
  document.getElementById('pc').innerHTML='<button class="pcl" onclick="closePanel()">×</button><div class="ptitle">対応不可の枠</div><div class="psub">'+ds+'　'+t+'〜'+et(t)+'</div><div style="background:#ffe4e6;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#9f1239">✕ 対応不可に設定されています</div><button class="bd" onclick="cancelOffSinglePanel(\''+k+'\')">対応不可を解除する</button>';
  openPanel();
}
async function cancelOffSinglePanel(k){ loading(true); await sb.from('slots').delete().match({date_key:k,is_off:true}); loading(false); delete offSlots[k]; closePanel(); renderT(); showToast('対応不可を解除しました'); }

function openCPanel(date,t,ml,k){
  var parts=ml.split('-'), menu=parts[0], loc=parts[1];
  var ds=(date.getMonth()+1)+'月'+date.getDate()+'日（'+DJ[date.getDay()]+'）';
  var iso=date.toISOString().slice(0,10);
  document.getElementById('pc').innerHTML='<button class="pcl" onclick="closePanel()">×</button><div class="ptitle">予約する</div><div class="psub">'+ds+'</div><div style="display:flex;gap:5px;margin-bottom:12px"><span class="ctag '+(MTAG[menu]||'')+'">'+MENUS[menu]+'</span><span class="ctag '+(LTAG[loc]||'')+'">'+LOCS[loc]+'</span></div><div style="background:#f5f5f5;border-radius:7px;padding:8px 11px;margin-bottom:14px;font-size:12px;color:#666">🕐 '+t+'〜'+et(t)+'（1時間）</div><div class="fgrp"><label class="flbl">お名前 <span style="color:#e94560">*</span></label><input class="finp" id="fn" placeholder="山田 太郎"></div><div class="fgrp"><label class="flbl">メールアドレス <span style="color:#e94560">*</span></label><input class="finp" id="fe" type="email" placeholder="yourmail@example.com"></div><div class="fgrp"><label class="flbl">電話番号</label><input class="finp" id="fp" type="tel" placeholder="090-XXXX-XXXX"></div><div class="fgrp"><label class="flbl">メッセージ（任意）</label><textarea class="finp" id="fm" rows="2" placeholder="気になることなど"></textarea></div><button class="bp" onclick="confirmBk(\''+iso+'\',\''+t+'\',\''+ml+'\',\''+k+'\')">予約を確定する</button>';
  openPanel();
}

async function confirmBk(iso,t,ml,k){
  var name=document.getElementById('fn').value.trim();
  var email=document.getElementById('fe').value.trim();
  if(!name){ showToast('⚠ お名前を入力してください'); return; }
  if(!email||email.indexOf('@')<0){ showToast('⚠ メールアドレスを入力してください'); return; }
  var parts=ml.split('-'), menu=parts[0], loc=parts[1];
  var phone=document.getElementById('fp').value;
  var msg=document.getElementById('fm').value;
  loading(true);
  var ok=await saveBooking(k,menu,loc,name,email,phone,msg);
  if(!ok){ loading(false); showToast('⚠ 予約に失敗しました。もう一度お試しください。'); return; }
  bookings[k]={date_key:k,menu:menu,loc:loc,name:name,email:email,phone:phone,message:msg,created_at:new Date().toISOString()};
  myEmail = email;
  localStorage.setItem('myEmail', email);
  myBookings.add(k);
  var ds=parseInt(iso.slice(5,7))+'月'+parseInt(iso.slice(8,10))+'日';

  // お客様へのメール送信
  var clientHtml = '<div style="font-family:sans-serif;max-width:500px;margin:0 auto;padding:20px">'
    + '<h2 style="color:#c2410c">Trainer Reserve — ご予約確認</h2>'
    + '<p>'+name+' 様、ご予約ありがとうございます。</p>'
    + '<table style="width:100%;border-collapse:collapse;margin:16px 0">'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">日時</td><td style="padding:8px">'+ds+'　'+t+'〜'+et(t)+'（1時間）</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">メニュー</td><td style="padding:8px">'+MENUS[menu]+'</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">場所</td><td style="padding:8px">'+LOCS[loc]+'</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">担当</td><td style="padding:8px">鈴木雅哉トレーナー</td></tr>'
    + '</table>'
    + '<p>当日はお気をつけてお越しください。<br>ご不明な点はトレーナーまでご連絡ください。</p>'
    + '<p style="color:#999;font-size:12px">このメールはTrainer Reserveより自動送信されています。</p>'
    + '</div>';

  // トレーナーへの通知メール
  var trainerHtml = '<div style="font-family:sans-serif;max-width:500px;margin:0 auto;padding:20px">'
    + '<h2 style="color:#c2410c">Trainer Reserve — 新規予約通知</h2>'
    + '<table style="width:100%;border-collapse:collapse;margin:16px 0">'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">日時</td><td style="padding:8px">'+ds+'　'+t+'〜'+et(t)+'</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">メニュー</td><td style="padding:8px">'+MENUS[menu]+'</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">場所</td><td style="padding:8px">'+LOCS[loc]+'</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">お客様</td><td style="padding:8px">'+name+' 様</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">電話番号</td><td style="padding:8px">'+(phone||'未入力')+'</td></tr>'
    + '<tr><td style="padding:8px;background:#f5f5f5;font-weight:bold">メッセージ</td><td style="padding:8px">'+(msg||'なし')+'</td></tr>'
    + '</table></div>';

  await Promise.all([
    sendEmail(email, '【予約確認】Trainer Reserve — '+ds+' '+t+'〜'+et(t), clientHtml),
    sendEmail(TRAINER_EMAIL, '【新規予約】'+name+'様 — '+ds+' '+t+'〜'+et(t), trainerHtml)
  ]);

  loading(false);
  // お客様側のみメール送信完了画面を表示
  document.getElementById('pc').innerHTML='<button class="pcl" onclick="closeMailPreview()">×</button>'
    +'<div class="ptitle">✅ 予約が確定しました！</div>'
    +'<div class="psub">確認メールをお送りしました</div>'
    +'<div style="background:#dcfce7;border-radius:9px;padding:14px;margin-bottom:14px">'
    +'<div style="font-size:13px;font-weight:700;color:#15803d;margin-bottom:8px">📧 '+email+' にメールを送りました</div>'
    +'</div>'
    +'<div class="infor"><span class="ik">日時</span><span class="iv">'+ds+'　'+t+'〜'+et(t)+'</span></div>'
    +'<div class="infor"><span class="ik">メニュー</span><span class="iv">'+MENUS[menu]+'</span></div>'
    +'<div class="infor"><span class="ik">場所</span><span class="iv">'+LOCS[loc]+'</span></div>'
    +'<button class="bp" onclick="closeMailPreview()">閉じる</button>';
  showToast('✅ '+name+'様の予約が完了しました！');
}
function closeMailPreview(){ closePanel(); if(mode==='client') renderC(); else renderT(); }

function openMyBk(date,t,k){
  var bk=bookings[k];
  var ds=(date.getMonth()+1)+'月'+date.getDate()+'日（'+DJ[date.getDay()]+'）';
  document.getElementById('pc').innerHTML='<button class="pcl" onclick="closePanel()">×</button><div class="ptitle">あなたの予約</div><div class="psub">'+ds+'</div><div style="background:#dcfce7;border-radius:9px;padding:12px 14px;margin-bottom:14px"><div style="font-size:14px;font-weight:700;color:#15803d;margin-bottom:4px">✅ 予約確定済み</div><div style="font-size:12px;color:#166534">🕐 '+t+'〜'+et(t)+'（1時間）</div></div><div class="infor"><span class="ik">メニュー</span><span class="iv">'+MENUS[bk.menu]+'</span></div><div class="infor"><span class="ik">場所</span><span class="iv">'+LOCS[bk.loc]+'</span></div><div class="infor"><span class="ik">お名前</span><span class="iv">'+bk.name+'</span></div><button class="bd" onclick="cancelMyBkPanel(\''+k+'\')">この予約をキャンセルする</button>';
  openPanel();
}
async function cancelMyBkPanel(k){ loading(true); await deleteBooking(k); loading(false); delete bookings[k]; myBookings.delete(k); closePanel(); renderC(); showToast('予約をキャンセルしました'); }

function updStats(){
  var ds=wkDates(wkOff).map(function(d){ return d.toISOString().slice(0,10); });
  var a=0,b=0;
  Object.keys(slotSets).forEach(function(k){ if(ds.some(function(d){ return k.startsWith(d); })&&!bookings[k]) a+=slotSets[k].size; });
  Object.keys(bookings).forEach(function(k){ if(ds.some(function(d){ return k.startsWith(d); })) b++; });
  document.getElementById('sta').textContent=a;
  document.getElementById('stb').textContent=b;
}

async function changeWeek(d){ wkOff+=d; await loadData(); if(mode==='trainer') renderT(); else renderC(); }

async function setMode(m){
  mode=m;
  document.getElementById('btn-trainer').classList.toggle('active',m==='trainer');
  document.getElementById('btn-client').classList.toggle('active',m==='client');
  document.getElementById('trainer-screen').style.display=m==='trainer'?'block':'none';
  document.getElementById('client-screen').style.display=m==='client'?'block':'none';
  document.getElementById('client-cal').style.display='none';
  if(m==='trainer'){ cancelSel(); cancelOffMode(); await loadData(); renderT(); }
  else { await loadData(); cMenu=''; cLoc=''; document.getElementById('loc-step').style.display='none'; document.querySelectorAll('.cs-card').forEach(function(c){ c.classList.remove('selected'); }); updCS(); }
  loading(false);
}

function openPanel(){ document.getElementById('panel').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closePanel(){ document.getElementById('panel').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
function showToast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },3000); }

// ===== 起動 =====
window.onload = function(){
  document.getElementById('pw-btn').onclick = function(){
    var val = document.getElementById('pw-input').value.trim();
    if(val === TRAINER_PW){
      document.getElementById('pw-screen').style.display='none';
      document.getElementById('topbar').style.display='flex';
      document.getElementById('btn-trainer').style.display='';
      document.getElementById('btn-client').style.display='';
      loading(true);
      loadData().then(function(){ setMode('trainer'); });
    } else {
      document.getElementById('pw-err').textContent='パスワードが違います';
      document.getElementById('pw-input').value='';
      document.getElementById('pw-input').focus();
    }
  };
  document.getElementById('pw-input').onkeydown = function(e){
    if(e.key==='Enter') document.getElementById('pw-btn').onclick();
  };
  document.getElementById('client-link').onclick = function(){
    document.getElementById('pw-screen').style.display='none';
    document.getElementById('topbar').style.display='flex';
    document.getElementById('btn-trainer').style.display='none';
    document.getElementById('btn-client').style.display='';
    loading(true);
    loadData().then(function(){ setMode('client'); });
  };
};
</script>
