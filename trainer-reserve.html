<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Trainer Reserve</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=7"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;background:#fff;color:#1a1a1a;}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;z-index:999;font-size:14px;color:#666;}
.login-screen{position:fixed;inset:0;background:#fff;z-index:998;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,20px)) 20px max(20px,env(safe-area-inset-bottom,20px));height:100vh;height:100dvh;min-height:100dvh;overflow-y:auto;}
.login-logo{font-size:24px;font-weight:700;color:#1a1a1a;margin-bottom:4px;}
.login-logo span{color:#c2410c;}
.login-sub{font-size:13px;color:#999;margin-bottom:32px;}
.login-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:340px;}
.login-card{border-radius:16px;padding:24px 16px;cursor:pointer;transition:all .15s;text-align:center;border:2px solid transparent;}
.lc-trainer{background:#fff7ed;border-color:#fed7aa;}
.lc-trainer:hover{background:#ffedd5;border-color:#f97316;}
.lc-client{background:#f0fdf4;border-color:#bbf7d0;}
.lc-client:hover{background:#dcfce7;border-color:#22c55e;}
.lc-icon{font-size:32px;margin-bottom:10px;}
.lc-name{font-size:14px;font-weight:700;color:#1a1a1a;}
.lc-sub{font-size:11px;color:#666;margin-top:3px;}
.pw-screen{position:fixed;inset:0;background:#fff;z-index:998;display:none;flex-direction:column;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,20px)) 0 max(24px,env(safe-area-inset-bottom,24px));height:100vh;height:100dvh;min-height:100dvh;}
.pw-box{background:#fff;border:0.5px solid #e5e5e5;border-radius:16px;padding:32px 28px;width:min(340px,90vw);margin:auto;flex-shrink:0;max-height:calc(100dvh - 48px);overflow-y:auto;}
.pw-logo{font-size:18px;font-weight:700;margin-bottom:4px;}
.pw-logo span{color:#c2410c;}
.pw-sub{font-size:12px;color:#666;margin-bottom:24px;}
.pw-input{width:100%;padding:10px 12px;border:0.5px solid #e5e5e5;border-radius:8px;font-size:14px;margin-bottom:6px;}
.pw-input:focus{outline:none;border-color:#c2410c;}
.pw-err{font-size:11px;color:#e94560;margin-bottom:12px;min-height:16px;}
.pw-btn{width:100%;padding:11px;background:#c2410c;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.pw-back{text-align:center;margin-top:12px;font-size:11px;color:#999;cursor:pointer;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid #e5e5e5;position:sticky;top:0;background:#fff;z-index:50;}
.logo{font-size:15px;font-weight:700;}
.logo span{color:#c2410c;}
.tbadge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;}
.tbadge-t{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
.tbadge-c{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.logout-btn{font-size:11px;color:#999;background:none;border:none;cursor:pointer;padding:4px 8px;}
.t-tabs{display:flex;border-bottom:0.5px solid #e5e5e5;position:sticky;top:44px;background:#fff;z-index:40;}
.t-tab{flex:1;padding:10px 4px;font-size:12px;font-weight:500;color:#666;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;}
.t-tab.active{color:#c2410c;border-bottom-color:#c2410c;}
.mode-selector{display:flex;gap:8px;padding:10px 14px;border-bottom:0.5px solid #e5e5e5;background:#f5f5f5;}
.msel-btn{flex:1;padding:10px 8px;border-radius:9px;border:2px solid #e5e5e5;cursor:pointer;font-size:12px;font-weight:700;text-align:center;background:#fff;color:#666;}
.msel-btn .msel-icon{font-size:16px;display:block;margin-bottom:3px;}
.msel-hint{font-size:10px;display:block;margin-top:1px;opacity:.8;}
.msel-btn.mode-add{border-color:#f59e0b;color:#92400e;background:#fffbeb;}
.msel-btn.mode-add.active{background:#f59e0b;color:#fff;}
.msel-btn.mode-off{border-color:#f43f5e;color:#9f1239;background:#fff1f2;}
.msel-btn.mode-off.active{background:#f43f5e;color:#fff;}
.action-toolbar{display:none;padding:8px 14px;border-bottom:1px solid;flex-wrap:wrap;gap:6px;align-items:center;}
.action-toolbar.active{display:flex;}
.at-add{background:#fffbeb;border-color:#fde68a;}
.at-off{background:#fff1f2;border-color:#fecdd3;}
.at-count{font-size:12px;font-weight:700;white-space:nowrap;}
.at-add .at-count{color:#92400e;}.at-off .at-count{color:#9f1239;}
.at-chips{display:flex;gap:4px;flex-wrap:wrap;}
.atc{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid;white-space:nowrap;flex-shrink:0;overflow:visible;}
.atc-pm{background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8;}
.atc-py{background:#dcfce7;border-color:#86efac;color:#166534;}
.atc-te{background:#fce7f3;border-color:#f9a8d4;color:#9d174d;}
.atc-ty{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1;}
.atc-rm{background:#fee2e2;border-color:#fca5a5;color:#991b1b;}
.atc-off{background:#ffe4e6;border-color:#fda4af;color:#9f1239;}
.at-done{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:#16a34a;border:1.5px solid #15803d;color:#fff;box-shadow:0 2px 6px rgba(22,163,74,.3);}
.at-done:hover{filter:brightness(.92);}
.at-selall{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:#fef3c7;border:1.5px solid #fbbf24;color:#92400e;white-space:nowrap;flex-shrink:0;}
.at-selall:hover{background:#fde68a;}
.at-cancel{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;border:1px solid #d1d5db;color:#6b7280;white-space:nowrap;flex-shrink:0;}
.at-cancel:hover{background:#f3f4f6;}
.stats-bar{display:flex;gap:8px;padding:8px 14px;border-bottom:0.5px solid #e5e5e5;}
.stat-pill{flex:1;background:#f5f5f5;border-radius:8px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;}
.stat-num{font-size:18px;font-weight:700;line-height:1;}
.stat-lbl{font-size:10px;color:#666;}
.sp-avail .stat-num{color:#16a34a;}.sp-booked .stat-num{color:#e94560;}
.legend-bar{display:flex;gap:8px;padding:6px 14px;border-bottom:0.5px solid #e5e5e5;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:#666;}
.ld{width:9px;height:9px;border-radius:2px;}
.week-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:0.5px solid #e5e5e5;}
.wbtn{background:#f5f5f5;border:.5px solid #e5e5e5;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px;color:#666;display:flex;align-items:center;justify-content:center;}
.wlbl{font-size:12px;font-weight:600;}
.cal-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media (max-width: 767px){
  .cal-outer{overflow-x:visible;overflow-y:visible;}
  .cal-head{position:sticky;top:80px;background:#fff;z-index:30;box-shadow:0 1px 0 #e8e8e8;}
  .cdh{background:#fff;}
}
.cal-inner{padding:6px 4px max(16px,env(safe-area-inset-bottom,16px));min-width:0;width:100%;}
.cal-head{display:grid;margin-bottom:2px;}
.cdh{text-align:center;padding:3px 1px;position:relative;min-width:0;overflow:hidden;}
.cdn{font-size:9px;color:#999;font-weight:500;}
.cdd{font-size:13px;font-weight:600;}
.cdd.today{color:#92400e;background:#fef9c3;border-radius:3px;}
.cdh.day-off .cdd{color:#f43f5e;}
.dob{display:none;position:absolute;bottom:1px;left:3px;right:3px;height:2px;background:#f43f5e;border-radius:1px;}
.cdh.day-off .dob{display:block;}
.cdh.off-mode-hover:hover{background:#fff1f2;cursor:pointer;border-radius:4px;}
.cal-body{display:grid;border-top:1px solid #e8e8e8;border-left:1px solid #e8e8e8;}
.tlbl{font-size:9px;color:#bbb;text-align:right;padding:3px 3px 0 0;display:flex;align-items:flex-start;justify-content:flex-end;border-bottom:1px solid #e8e8e8;border-right:1px solid #e8e8e8;height:64px;background:#fafafa;min-width:0;overflow:hidden;}
.cdd.sat{color:#1e40af;}
.cdd.sun{color:#e94560;}
.cdn.sat{color:#93c5fd;}
.cdn.sun{color:#fca5a5;}
.slot-cell{border-bottom:1px solid #e8e8e8;border-right:1px solid #e8e8e8;padding:2px;height:64px;display:flex;min-width:0;overflow:hidden;}
.slot{border-radius:4px;flex:1;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:600;border:1px solid transparent;overflow:hidden;padding:0 2px;cursor:default;}
.t-empty{background:transparent;}
.t-idle{background:#f5f5f5;border:.5px solid #efefef;opacity:.5;}
.t-idle-add{background:#fefce8;border:.5px dashed #fbbf24;cursor:pointer;}
.t-idle-off{background:#fff1f2;border:.5px dashed #fda4af;opacity:.8;cursor:pointer;}
.t-sel-add{background:#f59e0b !important;border:2px solid #d97706 !important;}
.t-sel-off{background:#f43f5e !important;border:2px solid #be123c !important;}
.t-avail{background:#fefce8;border-color:#fde68a;cursor:pointer;}
.t-avail-add{background:#fefce8;border:2px dashed #fbbf24;cursor:pointer;}
.t-avail-off{background:#fefce8;border:2px dashed #fda4af;cursor:pointer;}
.t-avail:hover,.t-avail-add:hover,.t-avail-off:hover{filter:brightness(.93);}
.t-off{background:#ffe4e6;border:.5px solid #fda4af;}
.t-dayoff{background:#ffe4e6;opacity:.5;}
.t-bk-pm{background:#f3e8ff;border-color:#d8b4fe;cursor:pointer;}
.t-bk-py{background:#dcfce7;border-color:#86efac;cursor:pointer;}
.t-bk-ty{background:#e0f2fe;border-color:#7dd3fc;cursor:pointer;}
.t-bk-te{background:#fce7f3;border-color:#f9a8d4;cursor:pointer;}
.t-bk-pm:hover,.t-bk-py:hover,.t-bk-ty:hover,.t-bk-te:hover{filter:brightness(.96);}
.bl-pm{color:#6b21a8;}.bl-py{color:#166534;}.bl-ty{color:#0369a1;}.bl-te{color:#9d174d;}
.x-off{font-size:9px;color:#fda4af;font-weight:700;}
.x-bk{font-size:9px;color:#9ca3af;font-weight:700;}
.c-empty{background:#f3f4f6;}
.c-off{background:#fff0f0;border:.5px solid #fecaca;}
.c-booked{background:#f3f4f6;border:.5px solid #e5e7eb;}
.c-mine{background:#16a34a;border-color:#15803d;cursor:pointer;}
.c-avail{background:#dcfce7;border-color:#86efac;cursor:pointer;}
.c-avail:hover{filter:brightness(.93);}
.slot-tags{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-items:center;}
.stag{font-size:7px;font-weight:700;padding:0 2px;border-radius:2px;line-height:1.5;white-space:nowrap;}
.stag-pm{background:#f3e8ff;color:#6b21a8;}
.stag-py{background:#dcfce7;color:#166534;}
.stag-te{background:#fce7f3;color:#9d174d;}
.stag-ty{background:#e0f2fe;color:#0369a1;}
.cm-wrap{padding:12px 14px;}
.cm-search{width:100%;padding:8px 12px;border:0.5px solid #e5e5e5;border-radius:8px;font-size:13px;margin-bottom:12px;background:#fff;}
.cm-search:focus{outline:none;border-color:#c2410c;}
.cm-card{background:#fff;border:0.5px solid #e5e5e5;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.cm-card:hover{border-color:#c2410c;}
.cm-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.cm-name{font-size:14px;font-weight:500;}
.cm-tk-ok{color:#16a34a;font-size:13px;font-weight:700;}
.cm-tk-low{color:#f59e0b;font-size:13px;font-weight:700;}
.cm-tk-none{color:#e94560;font-size:13px;font-weight:700;}
.cm-email{font-size:11px;color:#666;}
.cm-add-btn{width:100%;padding:11px;background:#c2410c;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:12px;}
.mypage-wrap{padding:14px;}
.my-email-inp{width:100%;padding:10px 12px;border:0.5px solid #e5e5e5;border-radius:8px;font-size:13px;margin-bottom:8px;}
.my-email-inp:focus{outline:none;border-color:#16a34a;}
.my-btn{width:100%;padding:10px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;}
.my-remain-card{background:#f0fdf4;border:0.5px solid #bbf7d0;border-radius:12px;padding:14px;margin-bottom:14px;text-align:center;}
.my-remain-num{font-size:36px;font-weight:700;color:#16a34a;line-height:1;}
.my-bk-card{background:#fff;border:0.5px solid #e5e5e5;border-radius:10px;padding:10px 12px;margin-bottom:6px;}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(300px,100vw);background:#fff;border-left:.5px solid #e5e5e5;padding:18px 16px env(safe-area-inset-bottom,18px);transform:translateX(110%);transition:transform .25s;z-index:200;overflow-y:auto;}
.panel.open{transform:translateX(0);}
.pcl{position:absolute;top:12px;right:12px;background:#f5f5f5;border:.5px solid #e5e5e5;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;color:#666;display:flex;align-items:center;justify-content:center;}
.ptitle{font-size:14px;font-weight:700;margin-bottom:2px;padding-right:28px;}
.psub{font-size:11px;color:#666;margin-bottom:14px;}
.fgrp{margin-bottom:12px;}
.flbl{font-size:11px;font-weight:600;color:#666;margin-bottom:4px;display:block;}
.finp{width:100%;padding:8px 10px;border:.5px solid #e5e5e5;border-radius:8px;font-size:13px;}
.finp:focus{outline:none;border-color:#c2410c;}
.bp{width:100%;padding:10px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:4px;}
.bd{width:100%;padding:9px;background:transparent;color:#e94560;border:1.5px solid #e94560;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;}
.infor{display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid #e5e5e5;font-size:12px;gap:8px;}
.infor:last-child{border-bottom:none;}
.ik{color:#666;white-space:nowrap;flex-shrink:0;}
.iv{font-weight:500;text-align:right;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:199;display:none;}
.overlay.show{display:block;}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,20px));left:50%;transform:translateX(-50%) translateY(60px);background:#1a1a2e;color:#fff;padding:9px 16px;border-radius:10px;font-size:12px;font-weight:500;transition:transform .25s;z-index:300;text-align:center;max-width:90vw;}
.toast.show{transform:translateX(-50%) translateY(0);}
.ctag{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.tag-pilates{background:#dbeafe;color:#1e40af;}
.tag-training{background:#fce7f3;color:#9d174d;}
.tag-meguro{background:#f3e8ff;color:#6b21a8;}
.tag-yokohama{background:#dcfce7;color:#166534;}
.tag-ebisu{background:#dbeafe;color:#1e40af;}
#trainer-screen{display:none;}
#client-screen{display:none;}
#topbar{display:none;}
.rp-wrap{padding:12px 14px;}
.rp-month-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.rp-month-lbl{font-size:15px;font-weight:700;}
.rp-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.rp-card{background:#f5f5f5;border-radius:10px;padding:14px;text-align:center;}
.rp-card-num{font-size:28px;font-weight:700;line-height:1;margin-bottom:4px;color:#1a1a1a;}
.rp-card-lbl{font-size:11px;color:#666;}
.rp-section-ttl{font-size:12px;font-weight:700;color:#666;margin-bottom:10px;}
.rp-bars{margin-bottom:18px;}
.rp-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.rp-bar-lbl{font-size:11px;font-weight:600;width:68px;flex-shrink:0;color:#444;}
.rp-bar-track{flex:1;background:#efefef;border-radius:4px;height:14px;overflow:hidden;}
.rp-bar-fill{height:100%;border-radius:4px;transition:width .4s;}
.rp-bar-num{font-size:11px;font-weight:700;width:24px;text-align:right;flex-shrink:0;color:#1a1a1a;}
.rp-rank-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid #e5e5e5;}
.rp-rank-row:last-child{border-bottom:none;}
.rp-rank-num{font-size:12px;font-weight:700;color:#bbb;width:18px;text-align:center;flex-shrink:0;}
.rp-rank-num.top{color:#f59e0b;}
.rp-rank-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-rank-cnt{font-size:12px;font-weight:700;color:#1a1a1a;flex-shrink:0;margin-right:6px;}
.rp-remain{font-size:11px;font-weight:700;flex-shrink:0;}
</style>
</head>
<body>
<div id="loading" class="loading-overlay">読み込み中...</div>

<div class="login-screen" id="login-screen">
  <div class="login-logo">Trainer <span>Reserve</span></div>
  <div class="login-sub">お選びください</div>
  <div class="login-cards">
    <div class="login-card lc-trainer" onclick="goTrainerPw()">
      <div class="lc-icon">🏋️</div>
      <div class="lc-name">トレーナー</div>
      <div class="lc-sub">管理画面へ</div>
    </div>
    <div class="login-card lc-client" onclick="goClientMode()">
      <div class="lc-icon">🙋</div>
      <div class="lc-name">お客様</div>
      <div class="lc-sub">予約・確認</div>
    </div>
  </div>
</div>

<div class="pw-screen" id="client-login-screen">
  <div class="pw-box">
    <div class="pw-logo">Trainer <span>Reserve</span></div>
    <div class="pw-sub">メールアドレスでログイン</div>
    <label class="flbl">メールアドレス</label>
    <input class="pw-input" id="cl-email-inp" type="email" placeholder="yourmail@example.com">
    <div class="pw-err" id="cl-email-err"></div>
    <button class="pw-btn" style="background:#16a34a" onclick="doClientLogin()">入る</button>
    <div class="pw-back" onclick="backToLogin()">← 戻る</div>
  </div>
</div>

<div class="pw-screen" id="pw-screen">
  <div class="pw-box">
    <div class="pw-logo">Trainer <span>Reserve</span></div>
    <div class="pw-sub">トレーナー専用ログイン</div>
    <label class="flbl">パスワード</label>
    <input class="pw-input" id="pw-input" type="password" placeholder="パスワードを入力">
    <div class="pw-err" id="pw-err"></div>
    <button class="pw-btn" id="pw-btn">ログイン</button>
    <div class="pw-back" onclick="backToLogin()">← 戻る</div>
  </div>
</div>

<div class="topbar" id="topbar">
  <div class="logo">Trainer <span>Reserve</span></div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="tbadge" id="topbar-badge"></span>
    <button class="logout-btn" onclick="backToLogin()">ログアウト</button>
  </div>
</div>

<div id="trainer-screen">
  <div class="t-tabs">
    <button class="t-tab active" id="ttab-cal" onclick="switchTTab('cal')">カレンダー</button>
    <button class="t-tab" id="ttab-clients" onclick="switchTTab('clients')">お客様管理</button>
    <button class="t-tab" id="ttab-report" onclick="switchTTab('report')">レポート</button>
  </div>
  <div id="ttab-cal-content">
    <div class="mode-selector">
      <button class="msel-btn mode-add" id="msel-add" onclick="toggleSelMode()"><span class="msel-icon">＋</span>空き枠を追加<span class="msel-hint">タップして選択</span></button>
    </div>
    <div class="action-toolbar at-add" id="at-add">

<script>
const TR_PW='masa1127';
const TR_EMAIL='masa.nu.pe.27@gmail.com';

var mode='',wkOff=0,rpOff=0;
var slotSets={},offSlots={},dayOffs={},bookings={},blockedSlots={};
var myBookings=new Set(),myEmail=localStorage.getItem('myEmail')||'',myName=localStorage.getItem('myName')||'';
var holidays=new Set();
var selMode=false,offMode=false,selCells=new Set(),offCells=new Set(),drag=false,preSelSlotSets=null;
var clients=[];

function L(s){document.getElementById('loading').style.display=s?'flex':'none';}

function goTrainerPw(){document.getElementById('login-screen').style.display='none';document.getElementById('pw-screen').style.display='flex';setTimeout(function(){document.getElementById('pw-input').focus();},100);}
function goClientMode(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('client-login-screen').style.display='flex';
  setTimeout(function(){document.getElementById('cl-email-inp').focus();},100);
}
async function doClientLogin(){
  var email=document.getElementById('cl-email-inp').value.trim();
  if(!email||email.indexOf('@')<0){document.getElementById('cl-email-err').textContent='正しいメールアドレスを入力してください';return;}
  L(true);
  var r=await sb.from('clients').select('id,name').eq('email',email).maybeSingle();
  L(false);
  if(r.error){document.getElementById('cl-email-err').textContent='通信エラーが発生しました。再度お試しください';return;}
  if(!r.data){document.getElementById('cl-email-err').textContent='登録されていないメールアドレスです';return;}
  localStorage.setItem('myEmail',email);
  localStorage.setItem('sessionMode','client');
  if(r.data.name){localStorage.setItem('myName',r.data.name);myName=r.data.name;}
  myEmail=email;
  document.getElementById('client-login-screen').style.display='none';
  mode='client';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('topbar-badge').textContent='お客様';
  document.getElementById('topbar-badge').className='tbadge tbadge-c';
  document.getElementById('client-screen').style.display='block';
  L(true);loadData().then(function(){renderC();L(false);});
}
function backToLogin(){
  ['login-screen'].forEach(function(id){document.getElementById(id).style.display='flex';});
  document.getElementById('pw-screen').style.display='none';
  document.getElementById('client-login-screen').style.display='none';
  document.getElementById('topbar').style.display='none';
  document.getElementById('trainer-screen').style.display='none';
  document.getElementById('client-screen').style.display='none';
  document.getElementById('pw-input').value='';
  document.getElementById('pw-err').textContent='';
  wkOff=0;rpOff=0;mode='';localStorage.removeItem('sessionMode');localStorage.removeItem('trainerTab');localStorage.removeItem('clientTab');cancelSel();cancelOffMode();
}

async function loadData(force){
  myEmail=localStorage.getItem('myEmail')||'';
  var key=_cacheKey();
  if(!force&&weekCache[key]){_restoreFromCache(weekCache[key]);return;}
  L(true);
  var dates=mode==='client'?clientWkDates(wkOff):wkDates(wkOff);
  var s=localISO(dates[0]),e=localISO(dates[6]);
  var r1=await sb.from('slots').select('*').gte('date_key',s).lte('date_key',e+'_z');
  slotSets={};offSlots={};
  (r1.data||[]).forEach(function(row){
    if(row.is_off){offSlots[row.date_key]=true;}
    else{if(!slotSets[row.date_key])slotSets[row.date_key]=new Set();slotSets[row.date_key].add(row.menu+'-'+row.loc);}
  });
  if(mode==='client'){
    var r2a=await sb.from('bookings').select('date_key,loc,menu').eq('status','confirmed').gte('date_key',s).lte('date_key',e+'_z');
    bookings={};(r2a.data||[]).forEach(function(r){bookings[r.date_key]={date_key:r.date_key,loc:r.loc,menu:r.menu,_booked:true};});
    myBookings=new Set();
    if(myEmail){
      var r2b=await sb.from('bookings').select('*').eq('email',myEmail).eq('status','confirmed').gte('date_key',s).lte('date_key',e+'_z');
      (r2b.data||[]).forEach(function(r){bookings[r.date_key]=r;myBookings.add(r.date_key);});
    }
  } else {
    var r2=await sb.from('bookings').select('*').eq('status','confirmed').gte('date_key',s).lte('date_key',e+'_z');
    bookings={};(r2.data||[]).forEach(function(r){bookings[r.date_key]=r;});myBookings=new Set();
  }
  _recomputeBlockedSlots();
  var r3=await sb.from('day_offs').select('*').gte('date_iso',s).lte('date_iso',e);
  dayOffs={};(r3.data||[]).forEach(function(r){dayOffs[r.date_iso]=true;});
  _saveToCache();
  L(false);
}

function deepCopySlotSets(s){var c={};for(var k in s){c[k]=new Set(s[k]);}return c;}function clearSelState(){selMode=false;selCells=new Set();preSelSlotSets=null;document.getElementById('msel-add').classList.remove('active');document.getElementById('at-add').classList.remove('active');}function toggleSelMode(){if(offMode)cancelOffMode();if(selMode){cancelSel();return;}selMode=true;preSelSlotSets=deepCopySlotSets(slotSets);document.getElementById('msel-add').classList.add('active');document.getElementById('at-add').classList.add('active');renderT();}
function cancelSel(){if(preSelSlotSets!==null){slotSets=preSelSlotSets;}clearSelState();renderT();}
function cancelOffMode(){offMode=false;offCells=new Set();}
function updSC(){document.getElementById('sel-count').textContent=selCells.size+'枠選択中';}

function assignSel(menu,loc){
  if(!selCells.size){showToast('⚠ 枠を選んでください');return;}
  var ml=menu+'-'+loc;
  var allHave=[...selCells].every(function(k){return slotSets[k]&&slotSets[k].has(ml);});
  if(allHave){
    for(var k of selCells){if(slotSets[k]){slotSets[k].delete(ml);if(!slotSets[k].size)delete slotSets[k];}}
    renderT();showToast('取り消し（完了で確定）');
  } else {
    var _blockedCells=[];
    for(var k of selCells){if(blockedSlots[k]&&blockedSlots[k].has(ml)){_blockedCells.push(k);}}
    if(_blockedCells.length>0){alert('前後1時間以内に別の場所の予約があるため追加できません');return;}
    for(var k of selCells){if(!slotSets[k])slotSets[k]=new Set();slotSets[k].add(ml);delete offSlots[k];}
    renderT();showToast('✓ '+selCells.size+'枠に追加（完了で確定）');
  }
}
function removeSel(){for(var k of selCells){delete slotSets[k];}renderT();showToast('削除（完了で確定）');}
function selectAllCells(){
  if(!selCells.size){showToast('⚠ 先にセルを選択してください');return;}
  var _allMls=['pilates-meguro','pilates-yokohama','training-yokohama','training-ebisu'];
  var _added=0,_blocked=0;
  for(var k of selCells){
    if(!slotSets[k])slotSets[k]=new Set();
    delete offSlots[k];
    _allMls.forEach(function(ml){
      if(blockedSlots[k]&&blockedSlots[k].has(ml)){_blocked++;return;}
      slotSets[k].add(ml);_added++;
    });
  }
  renderT();
  if(_blocked>0)showToast('✓ '+_added+'枠追加（'+_blocked+'件はブロック）');
  else showToast('✓ 選択中'+selCells.size+'セルに全エリア追加（完了で確定）');
}
async function confirmSel(){
  L(true);
  var pre=preSelSlotSets||{};
  var cellsToProcess=new Set(selCells);
  try{
    for(var k of cellsToProcess){
      var newSet=slotSets[k]||new Set();
      var oldSet=pre[k]||new Set();
      if(newSet.size===0&&oldSet.size>0){
        var dr=await sb.from('slots').delete().eq('date_key',k);
        if(dr.error)throw new Error(dr.error.message);
      }else{
        for(var ml of newSet){
          if(!oldSet.has(ml)){
            var pts=ml.split('-');
            var ir=await sb.from('slots').insert({date_key:k,menu:pts[0],loc:pts[1],is_off:false});
            if(ir.error)throw new Error(ir.error.message);
          }
        }
        for(var ml of oldSet){
          if(!newSet.has(ml)){
            var pts=ml.split('-');
            var xr=await sb.from('slots').delete().match({date_key:k,menu:pts[0],loc:pts[1]});
            if(xr.error)throw new Error(xr.error.message);
          }
        }
      }
    }
    clearSelState();
    invalidateWeekCache();
    await loadData();
    renderT();
    showToast('✓ 空き枠を保存しました');
  }catch(e){
    console.error('保存エラー:',e);
    clearSelState();
    invalidateWeekCache();
    await loadData();
    renderT();
    showToast('⚠ 保存に失敗しました');
  }
}
async function applyOff(){
  if(!offCells.size){showToast('⚠ 枠を選んでください');return;}L(true);
  for(var k of offCells){await saveOffSlot(k);offSlots[k]=true;delete slotSets[k];}
  invalidateWeekCache();
  L(false);offCells=new Set();updOC();renderT();showToast('✕ 対応不可にしました');
}
async function cancelOff(){
  if(!offCells.size){showToast('⚠ 枠を選んでください');return;}L(true);
  for(var k of offCells){await sb.from('slots').delete().match({date_key:k,is_off:true});delete offSlots[k];}
  invalidateWeekCache();
  L(false);offCells=new Set();updOC();renderT();showToast('OFF解除しました');
}
async function toggleDayOff(iso){
  L(true);
  if(dayOffs[iso]){await deleteDayOff(iso);delete dayOffs[iso];showToast(iso.slice(5).replace('-','/')+' OFF解除');}
  else{await saveDayOff(iso);dayOffs[iso]=true;Object.keys(slotSets).forEach(function(k){if(k.startsWith(iso))delete slotSets[k];});showToast(iso.slice(5).replace('-','/')+' まるごとOFF');}
  invalidateWeekCache();
  L(false);renderT();
}

function mkTags(sets){
  var w=document.createElement('div');w.className='slot-tags';
  [...sets].slice(0,3).forEach(function(ml){var s=document.createElement('span');s.className='stag '+(TC[ml]||'');s.textContent=TL[ml]||ml;w.appendChild(s);});
  if(sets.size>3){var m=document.createElement('span');m.className='stag';m.style.cssText='background:#f5f5f5;color:#666';m.textContent='+'+(sets.size-3);w.appendChild(m);}
  return w;
}


function renderT(){
  var dates=wkDates(wkOff);
  document.getElementById('wlbl-t').textContent=fmt(dates[0])+' – '+fmt(dates[6]);
  var COL='32px repeat(7,minmax(0,1fr))';
  var head=document.getElementById('cal-head-t');
  head.style.gridTemplateColumns=COL;
  head.innerHTML='<div></div>'+dates.map(function(d){
    var iso=localISO(d),doff=!!dayOffs[iso],past=isPast(d);
    var dy=d.getDay();
    var dcls=(dy===6?' sat':dy===0?' sun':'');
    var effCls=holidays.has(iso)?' sun':dcls;
    return '<div class="cdh'+(doff?' day-off':'')+'" id="hdr-'+iso+'" style="'+(past?'opacity:.35':'')+'">'
      +'<div class="cdn'+effCls+'">'+DJ[d.getDay()]+'</div><div class="cdd'+(isToday(d)?' today':'')+effCls+'">'+d.getDate()+(holidays.has(iso)?'<span style="font-size:7px;vertical-align:top;margin-left:1px">祝</span>':'')+(doff?'✕':'')+'</div><div class="dob"></div></div>';
  }).join('');
  var body=document.getElementById('cal-body-t');
  body.style.gridTemplateColumns=COL;body.innerHTML='';
  TIMES.forEach(function(t){
    var tl=document.createElement('div');tl.className='tlbl';tl.textContent=t;body.appendChild(tl);
    dates.forEach(function(date){
      var k=ck(date,t),iso=localISO(date);
      var sets=slotSets[k],hasSets=sets&&sets.size>0;
      var isOff=!!offSlots[k],doff=!!dayOffs[iso],past=isPast(date);
      var isSel=selCells.has(k),bk=bookings[k];
      var sc=document.createElement('div');sc.className='slot-cell';
      var sl=document.createElement('div');sl.className='slot';
      if(bk&&past){
        sl.className='slot '+(BKC[bk.menu+'-'+bk.loc]||'t-bk-pm');sl.style.opacity='.45';sl.style.pointerEvents='none';
        var last=bk.name?(bk.name.split(/[\s\u3000]/)[0]):'';
        sl.innerHTML='<span style="font-size:7px;font-weight:700;overflow:hidden;max-width:100%;text-overflow:ellipsis" class="'+(BLC[bk.menu+'-'+bk.loc]||'')+'">'+LOCS[bk.loc]+'：'+last+'様</span>';
      } else if(past){sl.className='slot t-idle';sl.style.opacity='.2';sl.style.pointerEvents='none';}
      else if(doff){sl.className='slot t-dayoff';sl.innerHTML='<span class="x-off">✕</span>';}
      else if(bk){
        sl.className='slot '+(BKC[bk.menu+'-'+bk.loc]||'t-bk-pm');
        var last=bk.name?(bk.name.split(/[\s\u3000]/)[0]):'';
        sl.innerHTML='<span style="font-size:7px;font-weight:700;overflow:hidden;max-width:100%;text-overflow:ellipsis" class="'+(BLC[bk.menu+'-'+bk.loc]||'')+'">'+LOCS[bk.loc]+'：'+last+'様</span>';
        if(!selMode){(function(dd,tt,kk){sl.onclick=function(){openBkDetail(dd,tt,kk);};})(date,t,k);}
      } else if(selMode&&isSel){sl.className='slot t-sel-add';if(hasSets)sl.appendChild(mkTags(sets));else sl.innerHTML='<span style="font-size:9px;color:#fff">✓</span>';}
      else if(isOff){sl.className='slot '+(selMode?'t-idle-add':'t-idle');if(selMode)sl.innerHTML='<span style="font-size:9px;color:#ca8a04">＋</span>';}
      else if(hasSets){
        if(selMode){
          sl.className='slot t-avail-add';
          sl.appendChild(mkTags(sets));
        } else {
          sl.className='slot';
          var _orderT=['pilates-meguro','pilates-yokohama','training-yokohama','training-ebisu'];
          var _combosT=[...sets].sort(function(a,b){
            var _aBlk=blockedSlots[k]&&blockedSlots[k].has(a)?1:0;
            var _bBlk=blockedSlots[k]&&blockedSlots[k].has(b)?1:0;
            if(_aBlk!==_bBlk)return _aBlk-_bBlk;
            return _orderT.indexOf(a)-_orderT.indexOf(b);
          });
          var _nT=_combosT.length;
          var _isMobT=window.matchMedia('(max-width: 767px)').matches;
          var _mkBtnT=function(ml,colMode){
            var col=MLCOL[ml]||{bg:'#f5f5f5',bd:'#e5e5e5',tc:'#1a1a1a'};
            var _isBlkT=blockedSlots[k]&&blockedSlots[k].has(ml);
            var btn=document.createElement(colMode?'div':'button');
            if(_isBlkT){
              if(colMode){
                btn.style.cssText='border-radius:4px;border:1px dashed #d1d5db;background:#f3f4f6;color:#9ca3af;font-size:9px;font-weight:700;padding:1px 2px;font-family:inherit;white-space:nowrap;width:100%;line-height:1.2;flex:1;display:flex;align-items:center;justify-content:center;position:relative;box-sizing:border-box;pointer-events:none;';
              } else {
                btn.style.cssText='flex:0 0 auto;border-radius:4px;border:1px dashed #d1d5db;background:#f3f4f6;color:#9ca3af;font-size:10px;font-weight:700;cursor:pointer;padding:3px 6px;white-space:nowrap;position:relative;font-family:inherit;';
              }
              btn.innerHTML=(TL[ml]||LOCS[ml.split('-')[1]])+'<span style="position:absolute;top:-4px;right:-3px;font-size:9px;line-height:1;background:#fff;border-radius:50%;padding:1px">🚶</span>';
              if(!colMode){
                btn.onclick=function(e){e.preventDefault();e.stopPropagation();if(blockedSlots[k]&&blockedSlots[k].has(ml)){alert('移動時間のためお客様から予約不可です');}else{openSlotDetail(date,t,k);}};
              }
            } else {
              if(colMode){
                btn.style.cssText='border-radius:4px;border:1px solid '+col.bd+';background:'+col.bg+';color:'+col.tc+';font-size:9px;font-weight:700;padding:1px 2px;font-family:inherit;white-space:nowrap;width:100%;line-height:1.2;flex:1;display:flex;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:none;';
              } else {
                btn.style.cssText='flex:0 0 auto;border-radius:4px;border:1px solid '+col.bd+';background:'+col.bg+';color:'+col.tc+';font-size:10px;font-weight:700;cursor:pointer;padding:3px 6px;white-space:nowrap;font-family:inherit;';
              }
              btn.textContent=TL[ml]||LOCS[ml.split('-')[1]];
              if(!colMode){
                (function(dd,tt,kk){btn.onclick=function(e){e.preventDefault();e.stopPropagation();openSlotDetail(dd,tt,kk);};})(date,t,k);
              }
            }
            return btn;
          };
          if(_isMobT){
            if(_nT===4){
              sl.style.cssText='display:flex;flex-direction:column;justify-content:flex-start;gap:1px;padding:2px 2px 14px 2px;background:transparent;border:none;cursor:pointer;position:relative;';
              _combosT.slice(0,3).forEach(function(ml){sl.appendChild(_mkBtnT(ml,true));});
              var _badgeT=document.createElement('span');
              _badgeT.style.cssText='position:absolute;bottom:1px;right:1px;background:#9ca3af;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:7px;line-height:1;pointer-events:none;';
              _badgeT.textContent='+1';
              sl.appendChild(_badgeT);
            } else {
              var _justT=_nT===3?'space-between':'center';
              sl.style.cssText='display:flex;flex-direction:column;justify-content:'+_justT+';gap:2px;padding:2px;background:transparent;border:none;cursor:pointer;';
              _combosT.forEach(function(ml){sl.appendChild(_mkBtnT(ml,true));});
            }
          } else {
            sl.style.cssText='display:flex;flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:center;padding:2px;gap:2px;background:transparent;border:none;';

var rpData={bookings:[],clients:[]};
function rpRange(off){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth()+off;
  while(m<0){m+=12;y--;}while(m>11){m-=12;y++;}
  var s=y+'-'+String(m+1).padStart(2,'0')+'-01';
  var e=y+'-'+String(m+1).padStart(2,'0')+'-'+String(new Date(y,m+1,0).getDate()).padStart(2,'0');
  return{y:y,m:m,start:s,end:e,label:y+'年'+(m+1)+'月'};
}

function renderReport(){
  var cls=rpData.clients;
  var registeredEmails=new Set(cls.map(function(c){return c.email;}));
  var bks=rpData.bookings.filter(function(b){return registeredEmails.has(b.email);});
  var totalSessions=bks.length;
  var uniqueClients=new Set(bks.map(function(b){return b.email;})).size;
  document.getElementById('rp-total').textContent=totalSessions;
  document.getElementById('rp-clients').textContent=uniqueClients;
  var keys=['pilates-meguro','pilates-yokohama','training-ebisu','training-yokohama'];
  var labels={'pilates-meguro':'P・目黒','pilates-yokohama':'P・横浜','training-ebisu':'T・恵比寿','training-yokohama':'T・横浜'};
  var colors={'pilates-meguro':'#93c5fd','pilates-yokohama':'#fde047','training-ebisu':'#f9a8d4','training-yokohama':'#6ee7b7'};
  var counts={};keys.forEach(function(k){counts[k]=0;});
  bks.forEach(function(b){var key=b.menu+'-'+b.loc;if(counts[key]!==undefined)counts[key]++;});
  var maxC=Math.max.apply(null,keys.map(function(k){return counts[k];}));if(maxC===0)maxC=1;
  var barHtml='';
  keys.forEach(function(k){
    var pct=Math.round(counts[k]/maxC*100);
    barHtml+='<div class="rp-bar-row"><div class="rp-bar-lbl">'+labels[k]+'</div><div class="rp-bar-track"><div class="rp-bar-fill" style="width:'+pct+'%;background:'+colors[k]+'"></div></div><div class="rp-bar-num">'+counts[k]+'</div></div>';
  });
  document.getElementById('rp-bars').innerHTML=barHtml;
  var emailCount={};
  bks.forEach(function(b){emailCount[b.email]=(emailCount[b.email]||0)+1;});
  var clMap={};cls.forEach(function(c){clMap[c.email]=c;});
  var ranked=Object.entries(emailCount).sort(function(a,b){return b[1]-a[1];});
  var rankHtml='';
  if(!ranked.length){rankHtml='<div style="color:#999;font-size:13px;text-align:center;padding:20px">データなし</div>';}
  ranked.forEach(function(entry,i){
    var email=entry[0],cnt=entry[1],c=clMap[email];
    var name=c?c.name:email;
    var remain=c?Math.max(0,(c.total_tickets||0)-(c.used_tickets||0)):null;
    var tcol=remain===null?'#999':remain>3?'#16a34a':remain>0?'#f59e0b':'#e94560';
    var numCls='rp-rank-num'+(i<3?' top':'');

    rankHtml+='<div class="rp-rank-row"><div class="'+numCls+'">'+(i+1)+'</div><div class="rp-rank-name">'+name+'</div><div class="rp-rank-cnt">'+cnt+'回</div>'+remainHtml+'</div>';
  });

}

async function addTix(email,amount,label,reset){
  L(true);
  var cr=await sb.from('clients').select('total_tickets,used_tickets').eq('email',email).maybeSingle();
  var c=cr.data||{};
  var remaining=(c.total_tickets||0)-(c.used_tickets||0);
  var newTotal,newUsed;
  if(reset||remaining<=0){newTotal=amount;newUsed=0;}
  else{newTotal=(c.total_tickets||0)+amount;newUsed=c.used_tickets||0;}
  await sb.from('clients').update({total_tickets:newTotal,used_tickets:newUsed}).eq('email',email);
  await sb.from('ticket_logs').insert({client_email:email,type:'purchase',amount:amount,note:label+'追加'});
  L(false);closePanel();await loadClients();showToast('✅ '+label+'を追加しました');
}

async function consumeTix(email){

  L(true);await sb.from('clients').update({used_tickets:(c.used_tickets||0)+1}).eq('email',email);await sb.from('ticket_logs').insert({client_email:email,type:'consume',amount:1,note:'手動消化'});L(false);

}
